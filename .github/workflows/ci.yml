name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# xcode-27 is the newest hosted image: same macOS build as development, so goldens should
# match. It is a preview. See docs/adr/0008-ci-runner.md.
env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build-test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Lint
        run: make lint
      - name: Build
        run: make build
      - name: Test
        run: make test
