name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# xcode-27 is the newest hosted image: same macOS build as development, so goldens should
# match. It is a preview. See docs/adr/0008-ci-runner.md.
env:
  DEVELOPER_DIR: /Applications/Xcode_27.2.app/Contents/Developer

jobs:
  build-test:
    name: Build and test
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
      - name: Lint
        run: make lint
      - name: Build
        run: make build
      - name: Test
        env:
          # Real Vision requests fail on this image. See docs/adr/0008-ci-runner.md.
          PDF2MD_CI_NO_VISION: "1"
        run: make test
      # Reports the reason Vision fails here, and shows when it starts working. A failure here
      # doesn't fail the job, and the tests that need Vision were skipped above, not passed.
      - name: Vision on this runner (informational)
        continue-on-error: true
        env:
          PDF2MD_HOME: ${{ runner.temp }}/pdf2md-home
        run: |
          make fixtures
          swift run --quiet pdf2md --output-dir "$RUNNER_TEMP" Fixtures/book.pdf
          cat "$PDF2MD_HOME/logs/pdf2md.log"
          ! grep -q 'note=' "$PDF2MD_HOME/logs/pdf2md.log"
